# Integration profile — real PostgreSQL via Testcontainers. @ServiceConnection
# supplies the ACTUAL datasource URL/username/password from the running container,
# overriding the placeholder values below (which exist only so the base
# application.properties' ${DB_PASSWORD} placeholder is never resolved here).
spring.datasource.url=jdbc:postgresql://localhost:5432/overridden_by_service_connection
spring.datasource.username=overridden
spring.datasource.password=overridden
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway runs the real PostgreSQL migrations and Hibernate validates them.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

railgpt.jwt.secret=integration-test-secret-integration-test-1234
railgpt.jwt.expiration-ms=3600000
