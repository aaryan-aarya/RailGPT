# Test profile — in-memory H2 in PostgreSQL mode. No external DB required.
spring.datasource.url=jdbc:h2:mem:railgpt;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# H2 unit tests build the schema from the entities (create-drop). The Flyway
# migrations target PostgreSQL, so they are disabled here. The PostgreSQL
# integration tests (Testcontainers) exercise the real Flyway migrations.
spring.flyway.enabled=false

railgpt.jwt.secret=test-secret-test-secret-test-secret-1234
railgpt.jwt.expiration-ms=3600000
railgpt.otp.hash-secret=railgpt-test-only-secret-key-12345678901234567890
railgpt.bootstrap-admin.enabled=false
railgpt.email.outbox.enabled=false
