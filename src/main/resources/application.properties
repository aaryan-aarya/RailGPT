
# ---------------------------------------------------------------------------
# RailGPT backend configuration
# Java 17 | Spring Boot 3.2.5 | PostgreSQL
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------------
server.port=${PORT:${SERVER_PORT:8081}}
server.forward-headers-strategy=framework

# ---------------------------------------------------------------------------
# PostgreSQL datasource
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# ---------------------------------------------------------------------------
# JPA / Hibernate
# Flyway owns schema changes; Hibernate validates the schema.
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# ---------------------------------------------------------------------------
# Flyway migrations
# ---------------------------------------------------------------------------
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration

# ---------------------------------------------------------------------------
# JWT authentication
# ---------------------------------------------------------------------------
railgpt.jwt.secret=${JWT_SECRET:}
railgpt.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# ---------------------------------------------------------------------------
# CORS
# ---------------------------------------------------------------------------
railgpt.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ---------------------------------------------------------------------------
# Authentication cookie
# ---------------------------------------------------------------------------
railgpt.cookie.secure=${COOKIE_SECURE:false}

# ---------------------------------------------------------------------------
# Email configuration
#
# Local development:
# EMAIL_PROVIDER=gmail
#
# Render production:
# EMAIL_PROVIDER=brevo
# BREVO_API_KEY=<configured securely in Render>
# ---------------------------------------------------------------------------

# Email provider selection
railgpt.email.provider=${EMAIL_PROVIDER:gmail}

# Brevo HTTPS API
railgpt.brevo.api-key=${BREVO_API_KEY:}

# Sender email address
railgpt.mail.from-address=${MAIL_FROM_ADDRESS:${MAIL_USERNAME:}}

# ---------------------------------------------------------------------------
# Gmail SMTP
# Used when EMAIL_PROVIDER=gmail.
# ---------------------------------------------------------------------------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000

# ---------------------------------------------------------------------------
# OTP security
# ---------------------------------------------------------------------------
railgpt.otp.hash-secret=${OTP_HASH_SECRET}

# ---------------------------------------------------------------------------
# Safe local/demo data seeding
# ---------------------------------------------------------------------------
railgpt.seed.enabled=${SEED_DATA_ENABLED:true}
railgpt.seed.accounts-enabled=${SEED_DEMO_ACCOUNTS_ENABLED:true}

# ---------------------------------------------------------------------------
# Admin bootstrap
# ---------------------------------------------------------------------------
railgpt.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}

# ---------------------------------------------------------------------------
# Email notification outbox
# ---------------------------------------------------------------------------
railgpt.email.outbox.enabled=${EMAIL_OUTBOX_ENABLED:true}

# ---------------------------------------------------------------------------
# OpenAPI / Swagger
# ---------------------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ---------------------------------------------------------------------------
# Actuator and monitoring
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

management.info.env.enabled=true

info.app.name=RailGPT
info.app.description=Railway reservation and passenger assistance sample application
info.app.version=1.0.0
