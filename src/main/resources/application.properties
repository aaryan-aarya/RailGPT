# ---------------------------------------------------------------------------
# RailGPT backend configuration.
# All secrets/credentials come from the environment — nothing sensitive is
# committed. See .env.example and README.md for the variables to set.
# ---------------------------------------------------------------------------

# Server
server.port=${SERVER_PORT:8081}

# DataSource (PostgreSQL) — primary database.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate. Flyway owns the schema; Hibernate only validates it.
# Do NOT use ddl-auto=update in production (see application-prod.properties).
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Flyway database migrations. Enabled by default; runs before Hibernate
# validation. baseline-on-migrate is intentionally left false so an existing
# incompatible schema fails loudly instead of being silently skipped.
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration

# JWT — set JWT_SECRET (>= 32 bytes) in production for stable sessions across
# restarts. If unset, an ephemeral key is generated (dev convenience only).
railgpt.jwt.secret=${JWT_SECRET:}
railgpt.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# CORS — comma-separated list of allowed browser origins.
railgpt.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Auth cookie — set COOKIE_SECURE=true when served over HTTPS.
railgpt.cookie.secure=${COOKIE_SECURE:false}

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
