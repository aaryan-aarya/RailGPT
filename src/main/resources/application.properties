# ---------------------------------------------------------------------------
# RailGPT backend configuration.
# All secrets/credentials come from the environment — nothing sensitive is
# committed. See .env.example and README.md for the variables to set.
# ---------------------------------------------------------------------------

# Server
server.port=${PORT:${SERVER_PORT:8081}}
server.forward-headers-strategy=framework

# DataSource (PostgreSQL) — primary database.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate. Flyway owns the schema; Hibernate only validates it.
# Do NOT use ddl-auto=update in production (see application-prod.properties).
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Flyway database migrations. Enabled by default; runs before Hibernate
# validation. baseline-on-migrate is intentionally left false so an existing
# incompatible schema fails loudly instead of being silently skipped.
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration

# JWT — set JWT_SECRET (>= 32 bytes) in production for stable sessions across
# restarts. If unset, an ephemeral key is generated (dev convenience only).
railgpt.jwt.secret=${JWT_SECRET:}
railgpt.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# CORS — comma-separated list of allowed browser origins.
railgpt.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Auth cookie — set COOKIE_SECURE=true when served over HTTPS.
railgpt.cookie.secure=${COOKIE_SECURE:false}

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ---------------------------------------------------------------------------
# Gmail SMTP — RailGPT email service
# ---------------------------------------------------------------------------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}
railgpt.mail.from-address=${MAIL_FROM_ADDRESS:${MAIL_USERNAME:}}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000
railgpt.otp.hash-secret=${OTP_HASH_SECRET}

# Safe local/demo seeding. Production defaults to disabled; hosted demos may opt
# into the illustrative train catalog without enabling bundled sample accounts.
railgpt.seed.enabled=${SEED_DATA_ENABLED:true}
railgpt.seed.accounts-enabled=${SEED_DEMO_ACCOUNTS_ENABLED:true}
railgpt.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
railgpt.email.outbox.enabled=${EMAIL_OUTBOX_ENABLED:true}

# Actuator: health and metrics are authenticated by Spring Security except for
# the minimal health endpoint used by load balancers and container probes.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.info.env.enabled=true
info.app.name=RailGPT
info.app.description=Railway reservation and passenger assistance sample application
info.app.version=1.0.0
