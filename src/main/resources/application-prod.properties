# Production profile — activate with: --spring.profiles.active=prod
#
# Required environment variables (NO credentials are hardcoded in this file):
#   DB_PASSWORD            — PostgreSQL password
#   JWT_SECRET             — JWT signing key, >= 32 bytes
#   CORS_ALLOWED_ORIGINS   — your real frontend origin(s)
#   DB_URL / DB_USERNAME   — as needed for your database
#
# Verify there are no literals here: every sensitive value resolves from the
# environment via the base application.properties placeholders.

spring.jpa.show-sql=false
railgpt.cookie.secure=true
railgpt.seed.enabled=false

# Flyway owns the production schema; Hibernate only validates it.
# Never use ddl-auto=update in production.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
