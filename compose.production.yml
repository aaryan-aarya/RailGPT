services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-railgpt}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-railgpt_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in the deployment environment}
      APP_DB_USER: ${DB_USERNAME:-railgpt_app}
      APP_DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the deployment environment}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/01-create-app-user.sh:/docker-entrypoint-initdb.d/01-create-app-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [private]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-railgpt}
      DB_USERNAME: ${DB_USERNAME:-railgpt_app}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the deployment environment}
      JWT_SECRET: ${JWT_SECRET:?Set a randomly generated JWT_SECRET of at least 32 bytes}
      OTP_HASH_SECRET: ${OTP_HASH_SECRET:?Set a separate randomly generated OTP_HASH_SECRET of at least 32 bytes}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set the exact public web origin}
      COOKIE_SECURE: "true"
      SEED_DATA_ENABLED: "false"
      EMAIL_OUTBOX_ENABLED: "true"
      BOOTSTRAP_ADMIN_ENABLED: ${BOOTSTRAP_ADMIN_ENABLED:-false}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_APP_PASSWORD: ${MAIL_APP_PASSWORD:-}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
    depends_on:
      db:
        condition: service_healthy
    expose: ["8081"]
    networks: [private, edge]

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    networks: [edge]

volumes:
  postgres_data:

networks:
  private:
    internal: true
  edge:
